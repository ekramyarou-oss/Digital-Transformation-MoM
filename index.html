<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاور مناقشة الاجتماع الخامس – لجنة التحول الرقمي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14213d;--mute:#5b6478;--acc:#0f766e;--gold:#b8860b;--line:#e3ddd0;--soft:rgba(15,118,110,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1726;--card:#16223a;--ink:#f1f5f9;--mute:#9aa7bd;--acc:#2dd4bf;--gold:#e9b949;--line:#26344f;--soft:rgba(45,212,191,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1726;--card:#16223a;--ink:#f1f5f9;--mute:#9aa7bd;--acc:#2dd4bf;--gold:#e9b949;--line:#26344f;--soft:rgba(45,212,191,.1);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.top{border-bottom:1px solid var(--line);background:var(--card)}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;font-weight:700}
.top small{color:var(--mute);font-weight:500}
.hero{padding:clamp(36px,8vw,88px) 0 clamp(24px,5vw,48px)}
.tag{color:var(--gold);font-weight:700}
h1{font-size:clamp(28px,5vw,56px);font-weight:800;line-height:1.3;margin:8px 0}
.sub{color:var(--mute);font-size:clamp(16px,2vw,22px)}
.bar{width:84px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--gold));margin:18px 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 16px;font-size:15px;color:var(--mute)}
h2.sec{font-size:clamp(22px,3vw,32px);font-weight:800;margin-bottom:6px}
.hint{color:var(--mute);margin-bottom:20px}
.list{display:grid;grid-template-columns:1fr 1.5fr;gap:clamp(16px,3vw,36px);align-items:start;padding-bottom:56px}
.nav{display:flex;flex-direction:column;gap:10px}
.hd{font:inherit;color:inherit;text-align:start;display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.hd .n{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:18px;transition:background .2s,color .2s}
.hd .tt{flex:1;font-weight:700;font-size:clamp(16px,1.8vw,19px);line-height:1.5}
.hd .tm{color:var(--mute);font-size:14px;white-space:nowrap}
.hd:hover,.hd:focus-visible,.hd.on{border-color:var(--acc);background:var(--soft);outline:none}
.hd:hover .n,.hd.on .n{background:var(--acc);color:var(--bg)}
.hd.on{transform:translateX(-6px)}
.stage{display:grid;position:sticky;top:20px}
.pn{grid-area:1/1;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,32px);opacity:0;visibility:hidden;transform:translateY(14px) scale(.98);transition:opacity .25s,transform .25s,visibility .25s}
.pn.on{opacity:1;visibility:visible;transform:none}
.pn h3{font-size:clamp(20px,2.6vw,28px);font-weight:800;line-height:1.4}
.lbl{font-weight:700;color:var(--acc);margin:18px 0 8px}
.q{border-inline-start:5px solid var(--acc);background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.out{background:var(--acc);color:var(--bg);border-radius:14px;padding:14px 18px;margin-top:16px;font-weight:500}
.out .lbl{color:var(--bg);opacity:.85;margin:0 0 4px}
.empty{display:grid;place-items:center;text-align:center;color:var(--mute);min-height:260px;font-size:18px}
.acc{display:none;flex-direction:column;gap:10px;padding-bottom:40px}
.mb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.it.open .mb{grid-template-rows:1fr}
.mi{overflow:hidden}
.mi .in{padding:6px 4px 4px}
footer{border-top:1px solid var(--line);color:var(--mute);text-align:center;padding:18px;font-size:14px}
@media (max-width:820px){.list{display:none}.acc{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><span>لجنة التحول الرقمي</span><small>هيئة سوق العمل</small></div></div>
<main class="wrap">
<section class="hero">
<div class="tag">مرفق بمحضر الاجتماع الخامس</div>
<h1>محاور مناقشة الاجتماع الخامس</h1>
<div class="bar"></div>
<div class="sub">بنود مختصرة للاطلاع عليها قبل الاجتماع</div>
<div class="meta"><span class="chip">الأحد 25/10/2026م</span><span class="chip">12:00 ظهرًا</span><span class="chip">مقر الهيئة بالمنصورة</span></div>
</section>
<h2 class="sec">جدول الأعمال</h2>
<p class="hint">مرّر المؤشر على أي بند لعرض تفاصيله (أو اضغط عليه).</p>
<div class="list"><div class="nav" id="nav"></div><div class="stage" id="stage"></div></div>
<div class="acc" id="acc"></div>
</main>
<footer>لجنة التحول الرقمي – هيئة سوق العمل</footer>
<script>
var A=[
{n:"•",t:"الافتتاح وكلمة رئيس اللجنة",m:"10 د",q:["الترحيب بالأعضاء وتأكيد أهمية مواصلة العمل وفق الاختصاصات","الانتقال من حصر الاحتياجات والتجهيزات إلى دراسة آليات الاستفادة الفعلية من التقنيات الحديثة","الاستفادة من تنوع الخبرات الفنية والقانونية والابتكار والذكاء الاصطناعي"],o:"الاتفاق على مسار عمل الاجتماع."},
{n:"1",t:"الخطة التدريبية والذكاء الاصطناعي",m:"30 د",q:["ما المجالات التدريبية ذات الأولوية؟ (الأنظمة المعتمدة، Office، إدارة المستندات، الأمن السيبراني، التقارير والعروض، أدوات التعاون)","كيف نحصر الاحتياجات التدريبية الفعلية ونحدد الفئات المستهدفة؟","أين يفيد الذكاء الاصطناعي؟ (المراسلات، التقارير، تلخيص المستندات، تحليل البيانات، العروض)","ما الضوابط اللازمة لسرية المعلومات وحماية البيانات والخصوصية؟"],o:"التوجه المقترح: حصر الاحتياجات التدريبية وتصنيفها، وإعداد تصور مبدئي لبرامج الذكاء الاصطناعي."},
{n:"2",t:"نظام إدارة الاجتماعات وتجهيز القاعة",m:"25 د",q:["ما وظائف النظام المطلوب؟ (جدولة، حضور وغياب، محاضر، توصيات ومتابعة، مرفقات)","ما المتطلبات الفنية والقانونية التي تُدرس قبل اعتماده؟","ما الذي ينقص القاعة؟ (شاشات، عرض مرئي، صوتيات، اتصال واجتماعات عن بُعد)","هل تصلح القاعة للاجتماعات والتدريب والعروض؟"],o:"التوجه المقترح: دراسة إنشاء النظام، وحصر احتياجات القاعة وإعداد مواصفاتها الفنية."},
{n:"3",t:"التوعية الرقمية للموظفين",m:"15 د",q:["ما موضوعات اللقاءات والدورات القصيرة؟ (حماية الحسابات والبيانات، البريد والروابط والملفات)","كيف نعرّف الموظفين بالأنظمة والخدمات الإلكترونية بالهيئة؟","كيف نضمن الاستخدام المسؤول لأدوات الذكاء الاصطناعي؟","كيف نرسّخ الالتزام بالصلاحيات والإجراءات المعتمدة؟"],o:"التوجه المقترح: إعداد تصور لبرنامج توعية رقمية يشمل أساسيات الأمن الرقمي."},
{n:"✓",t:"التوصيات والتكليفات",m:"10 د",q:["صياغة ما تتفق عليه اللجنة من توصيات","تكليف الأعضاء كلٌّ حسب اختصاصه بإعداد التصورات","معايير أي حل تقني جديد: الاحتياج، التكلفة، الأمان، التكامل، قابلية التوسع","إدراج ما يحتاج دراسة فنية أو قانونية في جدول الاجتماعات القادمة"],o:"توصيات معتمدة تُثبَّت في المحضر."}
];
function body(a){return '<h3>'+a.t+'</h3><div class="meta"><span class="chip">الزمن: '+a.m+'</span></div><div class="lbl">للمناقشة</div>'+a.q.map(function(q){return '<div class="q">'+q+'</div>'}).join('')+'<div class="out"><div class="lbl">المخرج المتوقع</div>'+a.o+'</div>'}
function hd(a,i,c){return '<button class="hd '+c+'" data-i="'+i+'"><span class="n">'+a.n+'</span><span class="tt">'+a.t+'</span><span class="tm">'+a.m+'</span></button>'}
document.getElementById('nav').innerHTML=A.map(function(a,i){return hd(a,i,'hw')}).join('');
document.getElementById('stage').innerHTML='<div class="pn empty on" data-i="-1">مرّر المؤشر على أحد البنود<br>لتظهر تفاصيله هنا</div>'+A.map(function(a,i){return '<div class="pn" data-i="'+i+'">'+body(a)+'</div>'}).join('');
document.getElementById('acc').innerHTML=A.map(function(a,i){return '<div class="it">'+hd(a,i,'hm')+'<div class="mb"><div class="mi"><div class="in">'+body(a).replace(/<h3>.*?<\/h3>/,'')+'</div></div></div></div>'}).join('');
var HW=document.querySelectorAll('.hw'),PN=document.querySelectorAll('.pn');
function act(i){HW.forEach(function(b){b.classList.toggle('on',+b.dataset.i===i)});PN.forEach(function(p){p.classList.toggle('on',+p.dataset.i===i)})}
HW.forEach(function(b){var i=+b.dataset.i;b.addEventListener('mouseenter',function(){act(i)});b.addEventListener('focus',function(){act(i)});b.addEventListener('click',function(){act(i)})});
document.querySelectorAll('.hm').forEach(function(b){b.addEventListener('click',function(){b.parentNode.classList.toggle('open')})});
</script>
</body>
</html>
